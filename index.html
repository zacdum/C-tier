    // --- APPLICATION PRINCIPALE REACT ---
    function App() {
      // Navigation Tabs: 'dashboard' | 'quiz' | 'exam' | 'mistakes' | 'progress' | 'weaknesses' | 'history'
      const [activeTab, setActiveTab] = useState('dashboard');

      // Profile & Saved State
      const [userProfile, setUserProfile] = useState(() => {
        const saved = localStorage.getItem('permis_cotier_profile');
        if (saved) {
          try { return JSON.parse(saved); } catch(e){}
        }
        return {
          seriesCompleted: 0,
          totalQuestionsAnswered: 0,
          totalCorrectAnswers: 0,
          mistakesHistory: [], // Array of mistake objects
          completedSeriesLog: [],
          categoryStats: Object.keys(CATEGORIES).reduce((acc, catId) => {
            acc[catId] = { asked: 0, correct: 0 };
            return acc;
          }, {})
        };
      });

      // Active Quiz State
      const [quizState, setQuizState] = useState(() => {
        const savedQuiz = localStorage.getItem('permis_cotier_active_quiz');
        if (savedQuiz) {
          try { return JSON.parse(savedQuiz); } catch(e){}
        }
        return {
          seriesNumber: 1,
          mode: 'diagnostic', // 'diagnostic' | 'adaptive' | 'exam' | 'mistakes_revision' | 'weakness_revision'
          questions: INITIAL_DIAGNOSTIC_QUESTIONS,
          currentIndex: 0,
          selectedIndices: [],
          isSubmitted: false,
          userAnswers: {}, // index -> array of indices
          score: 0,
          isCompleted: false,
          startTime: Date.now()
        };
      });

      // Save state changes
      useEffect(() => {
        localStorage.setItem('permis_cotier_profile', JSON.stringify(userProfile));
      }, [userProfile]);

      useEffect(() => {
        localStorage.setItem('permis_cotier_active_quiz', JSON.stringify(quizState));
      }, [quizState]);

      // Handle Option Selection (Supports Single & Multiple selection)
      const handleOptionClick = (index) => {
        if (quizState.isSubmitted) return;

        const currentQ = quizState.questions[quizState.currentIndex];
        
        if (!currentQ.isMultiple) {
          // Single Choice: Directly select and set single index
          setQuizState(prev => ({ ...prev, selectedIndices: [index] }));
        } else {
          // Multiple Choice: Toggle option
          setQuizState(prev => {
            const exists = prev.selectedIndices.includes(index);
            const updated = exists 
              ? prev.selectedIndices.filter(i => i !== index)
              : [...prev.selectedIndices, index];
            return { ...prev, selectedIndices: updated };
          });
        }
      };

      // Submit Answer for current question
      const handleSubmitAnswer = () => {
        if (quizState.selectedIndices.length === 0 || quizState.isSubmitted) return;

        const currentQ = quizState.questions[quizState.currentIndex];
        const correctSet = new Set(currentQ.correctIndices);
        const userSet = new Set(quizState.selectedIndices);

        // Exact match required for full point
        const isCorrect = correctSet.size === userSet.size && 
          [...correctSet].every(idx => userSet.has(idx));

        const newScore = isCorrect ? quizState.score + 1 : quizState.score;

        setQuizState(prev => ({
          ...prev,
          isSubmitted: true,
          score: newScore,
          userAnswers: {
            ...prev.userAnswers,
            [prev.currentIndex]: prev.selectedIndices
          }
        }));

        // Record stats immediately
        setUserProfile(prev => {
          const catStats = { ...prev.categoryStats };
          const cId = currentQ.categoryId;
          if (!catStats[cId]) catStats[cId] = { asked: 0, correct: 0 };
          catStats[cId].asked += 1;
          if (isCorrect) catStats[cId].correct += 1;

          let newMistakes = [...prev.mistakesHistory];
          if (!isCorrect) {
            newMistakes.unshift({
              questionId: currentQ.id,
              categoryId: currentQ.categoryId,
              questionText: currentQ.question,
              diagramId: currentQ.diagramId,
              userIndices: quizState.selectedIndices,
              correctIndices: currentQ.correctIndices,
              options: currentQ.options,
              rationale: currentQ.rationale,
              rule: currentQ.rule,
              timestamp: Date.now()
            });
          }

          return {
            ...prev,
            totalQuestionsAnswered: prev.totalQuestionsAnswered + 1,
            totalCorrectAnswers: prev.totalCorrectAnswers + (isCorrect ? 1 : 0),
            categoryStats: catStats,
            mistakesHistory: newMistakes
          };
        });
      };

      // Next Question / Complete Series
      const handleNextQuestion = () => {
        if (quizState.currentIndex < quizState.questions.length - 1) {
          setQuizState(prev => ({
            ...prev,
            currentIndex: prev.currentIndex + 1,
            selectedIndices: [],
            isSubmitted: false
          }));
        } else {
          // Finish Series
          setQuizState(prev => ({ ...prev, isCompleted: true }));

          setUserProfile(prev => ({
            ...prev,
            seriesCompleted: prev.seriesCompleted + 1,
            completedSeriesLog: [
              {
                seriesNumber: quizState.seriesNumber,
                mode: quizState.mode,
                score: quizState.score,
                total: quizState.questions.length,
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
              },
              ...prev.completedSeriesLog
            ]
          }));
        }
      };

      // Start New Series (Adaptive or Exam)
      const startNewSeries = (mode = 'adaptive') => {
        // Generate 20 questions based on mode and weak points
        let newQuestions = [...INITIAL_DIAGNOSTIC_QUESTIONS];
        
        // Shuffle questions and options
        newQuestions = newQuestions.map(q => {
          // Shuffle options while tracking correct indices
          const indexedOptions = q.options.map((opt, idx) => ({ opt, isCorrect: q.correctIndices.includes(idx) }));
          const shuffled = [...indexedOptions].sort(() => Math.random() - 0.5);
          
          return {
            ...q,
            options: shuffled.map(o => o.opt),
            correctIndices: shuffled.reduce((acc, curr, idx) => {
              if (curr.isCorrect) acc.push(idx);
              return acc;
            }, [])
          };
        }).sort(() => Math.random() - 0.5);

        setQuizState({
          seriesNumber: userProfile.seriesCompleted + 1,
          mode: mode,
          questions: newQuestions,
          currentIndex: 0,
          selectedIndices: [],
          isSubmitted: false,
          userAnswers: {},
          score: 0,
          isCompleted: false,
          startTime: Date.now()
        });

        setActiveTab('quiz');
      };

      // Start Targeted Revision
      const startMistakesRevision = () => {
        if (userProfile.mistakesHistory.length === 0) return;
        
        const mistakeQuestions = userProfile.mistakesHistory.slice(0, 10).map((m, idx) => ({
          id: 9000 + idx,
          categoryId: m.categoryId,
          question: m.questionText,
          diagramId: m.diagramId,
          isMultiple: m.correctIndices.length > 1,
          options: m.options,
          correctIndices: m.correctIndices,
          rationale: m.rationale,
          rule: m.rule
        }));

        setQuizState({
          seriesNumber: userProfile.seriesCompleted + 1,
          mode: 'mistakes_revision',
          questions: mistakeQuestions,
          currentIndex: 0,
          selectedIndices: [],
          isSubmitted: false,
          userAnswers: {},
          score: 0,
          isCompleted: false,
          startTime: Date.now()
        });

        setActiveTab('quiz');
      };

      // Calculated stats
      const overallPercentage = userProfile.totalQuestionsAnswered > 0 
        ? Math.round((userProfile.totalCorrectAnswers / userProfile.totalQuestionsAnswered) * 100) 
        : 0;

      const currentQ = quizState.questions[quizState.currentIndex];

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-20 pt-3 px-4 relative">
          
          {/* TOP HEADER / LOGO */}
          <header className="flex items-center justify-between py-3 mb-2 border-b border-slate-800">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i data-lucide="compass" className="w-5 h-5 text-white animate-spin-slow"></i>
              </div>
              <div>
                <h1 className="text-base font-bold text-white tracking-wide leading-tight">PERMIS CÔTIER</h1>
                <p className="text-[10px] font-medium text-cyan-400 tracking-wider uppercase">Entraîneur Officiel</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-cyan-300">
                Série {quizState.seriesNumber}
              </span>
            </div>
          </header>

          {/* MAIN CONTENT AREA DEPENDING ON ACTIVE TAB */}
          <main className="flex-1 flex flex-col">

            {/* --- TAB 1: DASHBOARD / ACCUEIL --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4 animate-fade-in">
                {/* GLASS HERO CARD */}
                <div className="glass-panel p-5 rounded-3xl relative overflow-hidden border border-cyan-500/20 bg-gradient-to-br from-slate-900/90 via-slate-800/80 to-cyan-950/40">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
                  
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <span className="text-xs font-medium text-cyan-400 uppercase tracking-widest">Diagnostic & Niveau</span>
                      <h2 className="text-xl font-bold text-white mt-0.5">Série 1 : Diagnostic</h2>
                    </div>
                    <div className="text-right">
                      <span className="text-2xl font-black text-cyan-400">{overallPercentage}%</span>
                      <p className="text-[10px] text-slate-400">Taux global</p>
                    </div>
                  </div>

                  <p className="text-xs text-slate-300 leading-relaxed mb-4">
                    {userProfile.seriesCompleted === 0 
                      ? "Bienvenue ! Commencez par la Série 1 de Diagnostic Initial (20 questions) pour mesurer votre niveau sur les 14 catégories officielles."
                      : `Vous avez terminé ${userProfile.seriesCompleted} série(s). Continuez votre entraînement adaptatif pour consolider vos points faibles.`}
                  </p>

                  <div className="grid grid-cols-2 gap-2 mb-4 text-center">
                    <div className="p-2.5 rounded-2xl bg-slate-800/60 border border-slate-700/50">
                      <span className="block text-lg font-bold text-white">{userProfile.seriesCompleted}</span>
                      <span className="text-[10px] text-slate-400 uppercase">Séries terminées</span>
                    </div>
                    <div className="p-2.5 rounded-2xl bg-slate-800/60 border border-slate-700/50">
                      <span className="block text-lg font-bold text-rose-400">{userProfile.mistakesHistory.length}</span>
                      <span className="text-[10px] text-slate-400 uppercase">Erreurs archivées</span>
                    </div>
                  </div>

                  <button 
                    onClick={() => {
                      if (!quizState.isCompleted && quizState.currentIndex > 0) {
                        setActiveTab('quiz');
                      } else {
                        startNewSeries('diagnostic');
                      }
                    }}
                    className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 flex items-center justify-center gap-2 active:scale-95 transition-all"
                  >
                    <i data-lucide="play-circle" className="w-5 h-5"></i>
                    {!quizState.isCompleted && quizState.currentIndex > 0 
                      ? `Reprendre la Série ${quizState.seriesNumber} (Q${quizState.currentIndex + 1}/20)`
                      : "Lancer la Série 1 (Diagnostic)"}
                  </button>
                </div>

                {/* ACTION CARDS */}
                <div className="grid grid-cols-2 gap-3">
                  <button 
                    onClick={() => startNewSeries('exam')}
                    className="p-4 rounded-2xl glass-panel border border-amber-500/20 hover:border-amber-500/40 text-left flex flex-col justify-between group active:scale-95 transition-all"
                  >
                    <div className="w-8 h-8 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 mb-2">
                      <i data-lucide="award" className="w-4 h-4"></i>
                    </div>
                    <div>
                      <h3 className="text-xs font-bold text-white group-hover:text-amber-300">Examen Blanc</h3>
                      <p className="text-[10px] text-slate-400 mt-0.5">20 questions en conditions réelles</p>
                    </div>
                  </button>

                  <button 
                    onClick={startMistakesRevision}
                    disabled={userProfile.mistakesHistory.length === 0}
                    className="p-4 rounded-2xl glass-panel border border-rose-500/20 hover:border-rose-500/40 text-left flex flex-col justify-between group disabled:opacity-50 active:scale-95 transition-all"
                  >
                    <div className="w-8 h-8 rounded-xl bg-rose-500/20 flex items-center justify-center text-rose-400 mb-2">
                      <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                    </div>
                    <div>
                      <h3 className="text-xs font-bold text-white group-hover:text-rose-300">Réviser mes Erreurs</h3>
                      <p className="text-[10px] text-slate-400 mt-0.5">{userProfile.mistakesHistory.length} question(s) ciblée(s)</p>
                    </div>
                  </button>
                </div>

                {/* PROGRESS OVERVIEW BY CATEGORIES */}
                <div className="glass-panel p-4 rounded-2xl space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-1.5">
                      <i data-lucide="bar-chart-2" className="w-4 h-4 text-cyan-400"></i>
                      Aperçu des 14 Catégories
                    </h3>
                    <button onClick={() => setActiveTab('progress')} className="text-[11px] text-cyan-400 hover:underline">Voir tout</button>
                  </div>

                  <div className="space-y-2.5">
                    {Object.entries(CATEGORIES).slice(0, 5).map(([catId, name]) => {
                      const stat = userProfile.categoryStats[catId] || { asked: 0, correct: 0 };
                      const pct = stat.asked > 0 ? Math.round((stat.correct / stat.asked) * 100) : 0;
                      return (
                        <div key={catId} className="text-xs">
                          <div className="flex justify-between text-slate-300 mb-1">
                            <span className="truncate max-w-[200px]">{name}</span>
                            <span className="font-semibold text-cyan-300">{pct}% ({stat.correct}/{stat.asked})</span>
                          </div>
                          <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div className="h-full bg-cyan-500 rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* --- TAB 2: ACTIVE QUIZ / SÉRIE EN COURS --- */}
            {activeTab === 'quiz' && (
              <div className="flex-1 flex flex-col justify-between space-y-3 animate-fade-in">
                
                {/* QUIZ COMPLETED SUMMARY VIEW */}
                {quizState.isCompleted ? (
                  <div className="glass-panel p-5 rounded-3xl space-y-4 my-auto border border-cyan-500/30 text-center">
                    <div className="w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-500 to-emerald-400 mx-auto flex items-center justify-center shadow-xl shadow-cyan-500/30">
                      <i data-lucide="trophy" className="w-8 h-8 text-white"></i>
                    </div>

                    <div>
                      <span className="text-xs font-semibold text-cyan-400 uppercase tracking-widest">Bilan de la Série</span>
                      <h2 className="text-3xl font-black text-white mt-1">
                        {quizState.score} / {quizState.questions.length}
                      </h2>
                      <p className="text-sm font-medium text-slate-300 mt-1">
                        Taux de réussite : <span className="text-cyan-400 font-bold">{Math.round((quizState.score / quizState.questions.length) * 100)}%</span>
                      </p>
                    </div>

                    <div className="p-3 rounded-2xl bg-slate-900/80 border border-slate-700/50 text-xs text-slate-300 leading-relaxed text-left space-y-1.5">
                      <p className="font-bold text-cyan-300">Analyse de la Série :</p>
                      {quizState.score >= 18 ? (
                        <p className="text-emerald-400">Excellent niveau ! Vous êtes très proche des exigences de l'examen théorique du Permis Côtier (maximum 5 erreurs autorisées sur 40 en examen réel).</p>
                      ) : quizState.score >= 14 ? (
                        <p className="text-amber-300">Bon travail. Quelques confusions subsistent sur certaines catégories. Entraînez-vous spécifiquement sur vos erreurs.</p>
                      ) : (
                        <p className="text-rose-400">Niveau insuffisant pour l'examen. Révisez les règles de sécurité, le RIPAM et le balisage puis relancez une série.</p>
                      )}
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button 
                        onClick={startMistakesRevision}
                        disabled={userProfile.mistakesHistory.length === 0}
                        className="py-3 px-3 rounded-xl glass-button text-xs font-bold text-rose-300 border-rose-500/30 hover:bg-rose-500/20 disabled:opacity-40"
                      >
                        Réviser mes Erreurs
                      </button>
                      <button 
                        onClick={() => startNewSeries('adaptive')}
                        className="py-3 px-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold shadow-lg shadow-cyan-500/20"
                      >
                        Prochaine Série
                      </button>
                    </div>
                  </div>
                ) : (
                  <>
                    {/* PROGRESS BAR & QUESTION COUNTER */}
                    <div>
                      <div className="flex justify-between items-center text-xs font-semibold mb-1.5 text-slate-300">
                        <span className="flex items-center gap-1.5">
                          <i data-lucide="help-circle" className="w-3.5 h-3.5 text-cyan-400"></i>
                          Question {quizState.currentIndex + 1} / {quizState.questions.length}
                        </span>
                        <span className="text-cyan-400 font-bold">Score : {quizState.score}</span>
                      </div>

                      <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                        <div 
                          className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full transition-all duration-300"
                          style={{ width: `${((quizState.currentIndex + 1) / quizState.questions.length) * 100}%` }}
                        ></div>
                      </div>

                      <div className="flex justify-between items-center mt-2">
                        <span className="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-800/80 text-slate-400 border border-slate-700/50 truncate max-w-[240px]">
                          {CATEGORIES[currentQ.categoryId]}
                        </span>
                        <span className="text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">
                          {currentQ.isMultiple ? "Plusieurs réponses possibles" : "Une seule réponse"}
                        </span>
                      </div>
                    </div>

                    {/* QUESTION TEXT CARD */}
                    <div className="glass-panel p-4 rounded-2xl border border-slate-700/60 space-y-3">
                      <h2 className="text-sm font-bold text-white leading-snug">
                        {currentQ.question}
                      </h2>

                      {/* DIAGRAM / VISUAL SCHEMATIC IF PRESENT */}
                      {currentQ.diagramId && (
                        <div className="my-2">
                          <DiagramVisual id={currentQ.diagramId} />
                        </div>
                      )}
                    </div>

                    {/* ANSWER OPTIONS LIST */}
                    <div className="space-y-2 my-2">
                      {currentQ.options.map((optionText, idx) => {
                        const isSelected = quizState.selectedIndices.includes(idx);
                        const isSubmitted = quizState.isSubmitted;
                        const isCorrectOption = currentQ.correctIndices.includes(idx);

                        let buttonStyle = "glass-button text-slate-200 border-slate-700/60 hover:bg-slate-800/80";
                        let badgeIcon = null;

                        if (isSelected && !isSubmitted) {
                          buttonStyle = "bg-cyan-950/80 border-cyan-500 text-cyan-200 shadow-lg shadow-cyan-500/10";
                        }

                        if (isSubmitted) {
                          if (isCorrectOption && isSelected) {
                            // Correctly selected
                            buttonStyle = "bg-emerald-950/90 border-emerald-500 text-emerald-200 font-medium";
                            badgeIcon = <i data-lucide="check-circle-2" className="w-5 h-5 text-emerald-400 flex-shrink-0"></i>;
                          } else if (isCorrectOption && !isSelected) {
                            // Missed correct answer
                            buttonStyle = "bg-amber-950/70 border-amber-500/80 text-amber-200 font-medium";
                            badgeIcon = <i data-lucide="alert-circle" className="w-5 h-5 text-amber-400 flex-shrink-0"></i>;
                          } else if (!isCorrectOption && isSelected) {
                            // Wrongly selected
                            buttonStyle = "bg-rose-950/90 border-rose-500 text-rose-200";
                            badgeIcon = <i data-lucide="x-circle" className="w-5 h-5 text-rose-400 flex-shrink-0"></i>;
                          } else {
                            buttonStyle = "opacity-40 border-slate-800 text-slate-400";
                          }
                        }

                        return (
                          <button
                            key={idx}
                            onClick={() => handleOptionClick(idx)}
                            disabled={isSubmitted}
                            className={`w-full p-3.5 rounded-2xl text-left text-xs font-medium flex items-center justify-between gap-3 active:scale-[0.99] transition-all min-h-[52px] ${buttonStyle}`}
                          >
                            <div className="flex items-center gap-2.5">
                              <span className={`w-6 h-6 rounded-lg flex items-center justify-center text-[11px] font-bold border ${
                                isSelected ? "bg-cyan-500 text-slate-950 border-cyan-400" : "bg-slate-800/80 text-slate-400 border-slate-700"
                              }`}>
                                {String.fromCharCode(65 + idx)}
                              </span>
                              <span className="leading-snug">{optionText}</span>
                            </div>
                            {badgeIcon}
                          </button>
                        );
                      })}
                    </div>

                    {/* SUBMIT / NEXT BUTTON & EXPLANATION PANEL */}
                    {!quizState.isSubmitted ? (
                      <button
                        onClick={handleSubmitAnswer}
                        disabled={quizState.selectedIndices.length === 0}
                        className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 disabled:opacity-40 text-white font-bold text-sm shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 active:scale-95 transition-all mt-auto"
                      >
                        Valider ma réponse
                        <i data-lucide="arrow-right" className="w-4 h-4"></i>
                      </button>
                    ) : (
                      <div className="space-y-3 animate-fade-in mt-auto">
                        {/* EXPLANATION CARD */}
                        <div className="p-4 rounded-2xl glass-panel border border-cyan-500/30 space-y-2 bg-slate-900/90">
                          <div className="flex items-center gap-2 text-xs font-bold text-cyan-400">
                            <i data-lucide="book-open" className="w-4 h-4"></i>
                            Explication Pédagogique
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">
                            {currentQ.rationale}
                          </p>

                          <div className="p-2.5 rounded-xl bg-cyan-950/50 border border-cyan-500/20 text-xs text-cyan-200 mt-2">
                            <span className="font-bold text-cyan-400 block mb-0.5">📌 RÈGLE À RETENIR :</span>
                            {currentQ.rule}
                          </div>
                        </div>

                        <button
                          onClick={handleNextQuestion}
                          className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 active:scale-95 transition-all"
                        >
                          {quizState.currentIndex < quizState.questions.length - 1 ? "Question Suivante" : "Terminer la Série"}
                          <i data-lucide="chevron-right" className="w-4 h-4"></i>
                        </button>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}

            {/* --- TAB 3: MES MAUVAISES RÉPONSES --- */}
            {activeTab === 'mistakes' && (
              <div className="space-y-3 animate-fade-in">
                <div className="flex justify-between items-center mb-1">
                  <div>
                    <h2 className="text-base font-bold text-white">Mes Mauvaises Réponses</h2>
                    <p className="text-xs text-slate-400">{userProfile.mistakesHistory.length} erreur(s) enregistrée(s)</p>
                  </div>
                  {userProfile.mistakesHistory.length > 0 && (
                    <button 
                      onClick={startMistakesRevision}
                      className="py-2 px-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 font-bold text-xs hover:bg-rose-500/30 active:scale-95 transition-all"
                    >
                      Lancer une révision
                    </button>
                  )}
                </div>

                {userProfile.mistakesHistory.length === 0 ? (
                  <div className="glass-panel p-8 rounded-3xl text-center space-y-2">
                    <i data-lucide="check-circle-2" className="w-12 h-12 text-emerald-400 mx-auto opacity-80"></i>
                    <h3 className="text-sm font-bold text-white">Aucune erreur archivée !</h3>
                    <p className="text-xs text-slate-400">Réalisez des séries de test pour identifier vos points d'amélioration.</p>
                  </div>
                ) : (
                  <div className="space-y-2.5 max-h-[70vh] overflow-y-auto custom-scrollbar pr-1">
                    {userProfile.mistakesHistory.map((item, idx) => (
                      <div key={idx} className="glass-panel p-3.5 rounded-2xl space-y-2 border border-rose-500/20">
                        <div className="flex justify-between items-start">
                          <span className="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-rose-950/80 text-rose-300 border border-rose-800/50">
                            {CATEGORIES[item.categoryId]}
                          </span>
                          <span className="text-[10px] text-slate-400">
                            {new Date(item.timestamp).toLocaleDateString('fr-FR')}
                          </span>
                        </div>

                        <p className="text-xs font-bold text-white leading-snug">{item.questionText}</p>

                        <div className="p-2.5 rounded-xl bg-slate-900/80 text-[11px] space-y-1">
                          <p className="text-rose-400">
                            <span className="font-bold">Votre réponse :</span> {item.userIndices.map(i => item.options[i]).join(', ')}
                          </p>
                          <p className="text-emerald-400">
                            <span className="font-bold">Bonne réponse :</span> {item.correctIndices.map(i => item.options[i]).join(', ')}
                          </p>
                        </div>

                        <div className="text-[11px] text-slate-300 bg-slate-800/40 p-2 rounded-lg border border-slate-700/50">
                          <span className="font-bold text-cyan-400">Règle : </span>{item.rule}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* --- TAB 4: MA PROGRESSION / STATISTIQUES --- */}
            {activeTab === 'progress' && (
              <div className="space-y-4 animate-fade-in">
                <div className="glass-panel p-4 rounded-3xl border border-cyan-500/20 space-y-3">
                  <h2 className="text-sm font-bold text-white flex items-center gap-2">
                    <i data-lucide="trending-up" className="w-4 h-4 text-cyan-400"></i>
                    Bilan Global du Candidat
                  </h2>

                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className="p-2.5 rounded-2xl bg-slate-800/60 border border-slate-700/50">
                      <span className="block text-base font-bold text-white">{userProfile.totalQuestionsAnswered}</span>
                      <span className="text-[9px] text-slate-400 uppercase">Questions</span>
                    </div>
                    <div className="p-2.5 rounded-2xl bg-slate-800/60 border border-slate-700/50">
                      <span className="block text-base font-bold text-emerald-400">{userProfile.totalCorrectAnswers}</span>
                      <span className="text-[9px] text-slate-400 uppercase">Réussies</span>
                    </div>
                    <div className="p-2.5 rounded-2xl bg-slate-800/60 border border-slate-700/50">
                      <span className="block text-base font-bold text-cyan-400">{overallPercentage}%</span>
                      <span className="text-[9px] text-slate-400 uppercase">Réussite</span>
                    </div>
                  </div>
                </div>

                {/* DETAILED STATS BY 14 CATEGORIES */}
                <div className="glass-panel p-4 rounded-3xl space-y-3">
                  <h3 className="text-xs font-bold text-white uppercase tracking-wider">
                    Détail par catégorie officielle
                  </h3>

                  <div className="space-y-3 max-h-[55vh] overflow-y-auto custom-scrollbar pr-1">
                    {Object.entries(CATEGORIES).map(([catId, name]) => {
                      const stat = userProfile.categoryStats[catId] || { asked: 0, correct: 0 };
                      const pct = stat.asked > 0 ? Math.round((stat.correct / stat.asked) * 100) : 0;
                      
                      let badgeColor = "text-slate-400 bg-slate-800";
                      if (stat.asked > 0) {
                        if (pct >= 80) badgeColor = "text-emerald-400 bg-emerald-950/60 border-emerald-500/30";
                        else if (pct >= 60) badgeColor = "text-amber-400 bg-amber-950/60 border-amber-500/30";
                        else badgeColor = "text-rose-400 bg-rose-950/60 border-rose-500/30";
                      }

                      return (
                        <div key={catId} className="p-2.5 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-1.5">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-semibold text-slate-200 truncate max-w-[220px]">{name}</span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${badgeColor}`}>
                              {stat.asked > 0 ? `${pct}% (${stat.correct}/${stat.asked})` : "Non testé"}
                            </span>
                          </div>
                          <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div 
                              className={`h-full rounded-full transition-all duration-500 ${pct >= 80 ? 'bg-emerald-500' : pct >= 60 ? 'bg-amber-500' : 'bg-rose-500'}`}
                              style={{ width: `${pct}%` }}
                            ></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* --- TAB 5: HISTORIQUE DES SÉRIES --- */}
            {activeTab === 'history' && (
              <div className="space-y-3 animate-fade-in">
                <h2 className="text-base font-bold text-white mb-2">Historique des Séries</h2>

                {userProfile.completedSeriesLog.length === 0 ? (
                  <div className="glass-panel p-8 rounded-3xl text-center space-y-2">
                    <i data-lucide="history" className="w-12 h-12 text-slate-500 mx-auto"></i>
                    <h3 className="text-sm font-bold text-white">Aucune série terminée</h3>
                    <p className="text-xs text-slate-400">Lancez la série 1 pour démarrer l'enregistrement de vos résultats.</p>
                  </div>
                ) : (
                  <div className="space-y-2 max-h-[70vh] overflow-y-auto custom-scrollbar pr-1">
                    {userProfile.completedSeriesLog.map((log, idx) => (
                      <div key={idx} className="glass-panel p-3.5 rounded-2xl flex justify-between items-center border border-slate-800">
                        <div>
                          <span className="text-xs font-bold text-white">Série {log.seriesNumber} ({log.mode})</span>
                          <p className="text-[10px] text-slate-400 mt-0.5">{log.date}</p>
                        </div>
                        <div className="text-right">
                          <span className="text-sm font-black text-cyan-400">{log.score} / {log.total}</span>
                          <span className="block text-[10px] font-semibold text-slate-300">
                            {Math.round((log.score / log.total) * 100)}%
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </main>

          {/* BOTTOM NAVIGATION BAR (iOS GLASS STYLE) */}
          <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-panel rounded-3xl p-1.5 border border-slate-700/60 shadow-2xl z-50 flex justify-around items-center">
            <button 
              onClick={() => setActiveTab('dashboard')}
              className={`p-2 rounded-2xl flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'dashboard' ? 'text-cyan-400 bg-slate-800/80 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <i data-lucide="home" className="w-5 h-5"></i>
              <span className="text-[9px]">Accueil</span>
            </button>

            <button 
              onClick={() => setActiveTab('quiz')}
              className={`p-2 rounded-2xl flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'quiz' ? 'text-cyan-400 bg-slate-800/80 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <i data-lucide="play" className="w-5 h-5"></i>
              <span className="text-[9px]">Série</span>
            </button>

            <button 
              onClick={() => setActiveTab('mistakes')}
              className={`p-2 rounded-2xl flex flex-col items-center gap-0.5 transition-all relative ${
                activeTab === 'mistakes' ? 'text-rose-400 bg-slate-800/80 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <i data-lucide="x-circle" className="w-5 h-5"></i>
              <span className="text-[9px]">Erreurs</span>
              {userProfile.mistakesHistory.length > 0 && (
                <span className="absolute top-1 right-2 w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
              )}
            </button>

            <button 
              onClick={() => setActiveTab('progress')}
              className={`p-2 rounded-2xl flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'progress' ? 'text-cyan-400 bg-slate-800/80 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <i data-lucide="bar-chart" className="w-5 h-5"></i>
              <span className="text-[9px]">Stats</span>
            </button>

            <button 
              onClick={() => setActiveTab('history')}
              className={`p-2 rounded-2xl flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'history' ? 'text-cyan-400 bg-slate-800/80 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <i data-lucide="clock" className="w-5 h-5"></i>
              <span className="text-[9px]">Historique</span>
            </button>
          </nav>

        </div>
      );
    }

    // Render application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize Lucide Icons after render
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 200);
  </script>
</body>
</html>
